<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajithkanna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <button id="theme-toggle" aria-label="Toggle Theme">
    <svg id="theme-icon" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
  </button>

  <div id="holo-beam"></div>

  <div id="companion-drone-wrapper">
    <div class="drone-body-3d">
      <div class="drone-eyes-slot"><div class="drone-eye"></div></div>
    </div>
  </div>

  <div id="hologram-skills-card">
    <h1>Technical S<span class="highlight-title">ki</span>lls</h1>
    <!-- <p style="font-size:.95rem;margin-bottom:24px;">Uplink established. Displaying developer node metrics:</p> -->
    <div id="skills-groups"></div>
  </div>

  <div id="viewport">
    <div id="world">
      <div id="floor-shadow"></div>
    </div>
  </div>

  <main>
    <section id="hero-section">
      <div class="hero-content">
        
        <div class="live-badge">
          <span class="pulse-dot"></span>
          <span class="badge-text">Online</span>
        </div>

        <div class="hero-title-group">
          <span class="hero-name">AJITH KANNA</span>
          <span class="hero-role">Fullstack Developer</span>
        </div>

        <p class="hero-desc">
        
        </p>
        
        <div class="metrics-grid" id="metrics-grid"></div>

        <div class="hero-actions">
          <a href="#exp-section" class="contact-btn primary-btn">Explore Mission Logs ↓</a>
        </div>

      </div>
    </section>

    <section id="skills-section"></section>

    <section id="exp-section">
      <div>
        <h1>Mission <span class="highlight-title">Hi</span>story</h1>
        <div class="timeline" id="timeline"></div>
      </div>
    </section>

    <section id="projects-section">
      <div>
        <h1><span class="highlight-title">De</span>ployed Builds</h1>
        <div class="project-grid" id="project-grid"></div>
      </div>
    </section>

    <section id="contact-section">
      <div>
        <div>
          <h1>Contact <span class="highlight-title">Me</span></h1>
        </div>
        <div class="glass-card footer-card">
          <div class="footer-info">
            <p style="font-size:.95rem; margin-bottom:0;">Have a question, an opportunity, or a project in mind? I am currently looking for new challenges and am always open to discussing creative ideas. Let's talk!</p>
          </div>
          <div class="contact-links footer-links" id="footer-links"></div>
        </div>
      </div>
    </section>
  </main>

<script src="js/script.js"></script>
</body>
</html>
